# https://apereo.github.io/cas/7.2.x/configuration/Configuration-Management.html
# In other CAS we could see cas.server.prefix: ${cas.server.name}${edatos.context} instead, but
# because here we have that property in common-metadata to use in other places, we use it and build the other two from it
cas.server.prefix: ${metamac.security.cas_server_url_prefix}
# This properties will be generated on org.siemac.metamac.cas.config.CommonMetadataPropertySourceBootstrapConfiguration
# And derived from cas.server.prefix
edatos.context: ${generated.edatos.context}
cas.server.name: ${generated.cas.server.name}

# Para poder trabajar como HTTP tras un proxy https
server.forward-headers-strategy: framework

# Redirigimos contra el logout del CAS delegado para finalizar el logout
cas.logout.redirectUrl: ${metamac.security.delegated.logout_url}

# Allow configuration classes to override bean definitions from Spring Boot
spring.main.allow-bean-definition-overriding: true

# Registro de servicios
# https://apereo.github.io/cas/7.3.x/services/JSON-Service-Management.html
cas.service-registry.json.location: classpath:/services/custom

# Resolucion de atributos
# https://apereo.github.io/cas/5.3.x/integration/Attribute-Resolution.html#multi-row
# https://apereo.github.io/cas/5.3.x/installation/Configuration-Properties.html#jdbc-1
cas.authn.attributeRepository.jdbc[0].singleRow: false
cas.authn.attributeRepository.jdbc[0].columnMappings.acl_name: acl_value
cas.authn.attributeRepository.jdbc[0].columnMappings.username_name: username_value
cas.authn.attributeRepository.jdbc[0].columnMappings.name_name: name_value
cas.authn.attributeRepository.jdbc[0].columnMappings.surname_name: surname_value
cas.authn.attributeRepository.jdbc[0].columnMappings.mail_name: mail_value
cas.authn.attributeRepository.jdbc[0].username: username
cas.authn.attributeRepository.jdbc[0].sql: ${metamac.security.datasource.query.attributes}
cas.authn.attributeRepository.jdbc[0].user: ${metamac.security.datasource.username}
cas.authn.attributeRepository.jdbc[0].password: ${metamac.security.datasource.password}
cas.authn.attributeRepository.jdbc[0].driverClass: ${metamac.security.datasource.driver_name}
cas.authn.attributeRepository.jdbc[0].url: ${metamac.security.datasource.url}

# Tiempo de expiración de la cache de atributos
# Estableciendo el valor a 0 no se cachean los atributos y evitamos problemas a la hora de refrescar posibles actualizaciones de roles
# https://apereo.github.io/cas/5.3.x/installation/Configuration-Properties.html#authentication-attributes
cas.authn.attribute-repository.core.expiration-time: 0

# Delegate Authentication via CAS
# https://apereo.github.io/cas/7.3.x/integration/Delegate-Authentication-CAS.html
# https://github.com/apereo/cas/blob/v7.3.1/api/cas-server-core-api-configuration-model/src/main/java/org/apereo/cas/configuration/model/support/delegation/DelegationAutoRedirectTypes.java
cas.authn.pac4j.cas[0].loginUrl: ${metamac.security.delegated.login_url}
cas.authn.pac4j.cas[0].autoRedirectType: ${cas.custom.properties.casAutoRedirect:SERVER}
cas.authn.pac4j.cas[0].clientName: DELEGATED_CAS

# Control de cabeceras
# https://apereo.github.io/cas/5.3.x/planning/Security-Guide.html#security-response-headers
# Se desactiva HSTS porque hay otras aplicaciones en el dominio que han de soportar HTTP
cas.httpWebRequest.header.hsts: false

# Desactivados los usuarios estaticos
# https://apereo.github.io/cas/5.3.x/installation/Configuration-Properties.html#accept-users-authentication
cas.authn.accept.users: 

# https://apereo.github.io/cas/7.3.x/installation/Configuring-Principal-Resolution.html#caspersondirectoryprincipaltransformationcaseconversionPropertyConfig
cas.person-directory.principal-transformation.case-conversion: LOWERCASE

# Debug SQL
#cas.jdbc.showSql: true

# Tiempos de expiración de tickets
# https://apereo.github.io/cas/5.0.x/installation/Configuration-Properties.html#service-ticket
cas.ticket.st.timeToKillInSeconds: 600 
# https://apereo.github.io/cas/5.3.x/installation/Configuration-Properties.html#transient-session-tickets-behavior
cas.ticket.tst.timeToKillInSeconds: 900

# Needed so OIDC CAS endpoints are compatible with Spring Boot 3.x
spring.mvc.pathmatch.matching-strategy: ANT_PATH_MATCHER

# OIDC Provider
# https://apereo.github.io/cas/7.3.x/authentication/OIDC-Authentication.html
cas.authn.oidc.core.issuer: ${cas.server.prefix}/oidc
cas.authn.oidc.discovery.claims: sub,acr,name,preferred_username,family_name,given_name,middle_name,profile,picture,nickname,website,zoneinfo,locale,updated_at,birthdate,email,email_verified,phone_number,phone_number_verified,address,gender,acl
cas.authn.oidc.core.user-defined-scopes.groups: ACL
cas.authn.oidc.jwks.file-system.jwks-file: file:${environment.metamac.data}/authentication-service/conf/oidc/oidc-keystore.jwks

# https://apereo.github.io/cas/5.3.x/installation/Configuration-Properties.html#saml-idp
cas.authn.saml-idp.metadata.file-system.location: file:${environment.metamac.data}/authentication-service/saml/idp
cas.authn.saml-idp.core.entity-id: ${metamac.security.cas_server_url_prefix}/idp
# Este valor en realidad no parece usarse hasta que pasemos a usar atributos scoped
# https://apereo.github.io/cas/6.5.x/integration/Attribute-Definitions.html#attribute-definitions
# Hasta entonces, puede tener un valor no significativo
cas.server.scope: edatos.io

# CAS Locale
# https://apereo.github.io/cas/development/ux/User-Interface-Customization-Localization.html
cas.locale.cookie.path: ${edatos.context}

