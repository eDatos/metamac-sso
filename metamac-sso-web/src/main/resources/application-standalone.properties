# Lecturas básicas para configurar autenticación delegada via SAML:
# - https://fawnoos.com/2019/02/25/cas61-delegate-authn-saml2-idp/
# - https://github.com/apereo/cas/blob/5.3.x/docs/cas-server-documentation/integration/Delegate-Authentication.md

# Apuntamos a la URL que contiene los metadatos del IDP 
#cas.authn.pac4j.saml[0].identity-provider-metadata-path: https://idp.dominio.es/SAML/metadata.xml

# Como provider entity Id usamos una URL, no necesariamente resoluble, formada de una manera concreta acorde a lo definido en https://spaces.at.internet2.edu/display/federation/saml-metadata-entityid
# Si estuvieramos en el lado del IDP, configurando un servicio en services/custom/*.json, el serviceId del mismo debe ser igual a este
#cas.authn.pac4j.saml[0].service-provider-entity-id: https://edatos.io/sp

# La carpeta file:${environment.metamac.data}/sso/saml/sp debe existir, porque el CAS no es capaz de crear carpetas intermedias
# Sin embargo, los archivos service-provider-metadata-path y keystore-path no hace falta que existan, se crean al acceder a /sp/metadata.
# Este sp-metadata.xml es específico para el service-provider-entity-id, y se le habrá de hacer llegar para que nos configuren como un SP / servicio válido
#cas.authn.pac4j.saml[0].service-provider-metadata-path: file:${environment.metamac.data}/sso/saml/sp/sp-metadata.xml
#cas.authn.pac4j.saml[0].keystore-path: file:${environment.metamac.data}/sso/saml/sp/sp-keystore.jks
#cas.authn.pac4j.saml[0].keystore-password: example-password
#cas.authn.pac4j.saml[0].private-key-password: example-password 
# Establish a CAS authenticated user (i.e. Principal) with an identifier that is mapped to the uid attribute returned from the provider https://fawnoos.com/2020/04/26/cas61x-delegate-authn-oauth/
# cas.authn.pac4j.principalAttributeId: uid

# We haven't found any other way to resolve properly the principal id. Things like cas.authn.pac4j.saml[0].principal-attribute-id, that looks like could work, don't work on Apereo CAS 5.x
# This is later used on org.apereo.cas.authentication.principal.resolvers.PersonDirectoryPrincipalResolver.extractPrincipalId(Credential, Optional<Principal>)
# This looks like it could be problematic because is a general configuration that could go wrong with others providers, but: this looks like it works properly with DELEGATED_CAS and 
# if we enable this is because we are using it for SAML. For example with https://idp.caib.es/, if we don't enable this, we won't match permissions because it will use a different long alphanumeric string
#cas.personDirectory.useExistingPrincipalId: true

# Importante, la propiedad autoRedirect debe estar a true porque es lo que luego en /metamac-sso-web/src/main/resources/templates/layout.html determina si redirige automaticamente al cas o al SAML
# Aunque existe esto: https://apereo.github.io/cas/7.0.x/integration/Delegate-Authentication-Redirection.html debido a que nosotros tenemos sobreescrito layout, no lo usamos
#cas.authn.pac4j.saml[0].autoRedirect: true

# Además, debemos setear esta propiedad a false para que no intente redirigir al CAS. Nótese que poner "cas.authn.pac4j.cas[0].autoRedirect: false" en este archivo no sobreescribe la propiedad
# https://fawnoos.com/2018/05/04/cas-custom-properties/
#cas.custom.properties.casAutoRedirect: false
#cas.authn.pac4j.saml[0].client-name: SAML2EDatosSSOClient
#cas.authn.pac4j.saml[0].destination-binding: urn:oasis:names:tc:SAML:2.0:bindings:HTTP-Redirect