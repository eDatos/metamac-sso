# Basic readings to configure delegated authentication via SAML:
# - https://fawnoos.com/2019/02/25/cas61-delegate-authn-saml2-idp/
# - https://apereo.github.io/cas/development/integration/Delegate-Authentication-SAML2.html
# - https://github.com/apereo/cas/blob/5.3.x/docs/cas-server-documentation/integration/Delegate-Authentication.md

# We point to the URL or file that contains the IDP metadata, especially useful if metadata.xml has multiple EntityDescriptor and we cannot distinguish between them in 5.3.x
#cas.authn.pac4j.saml[0].metadata.identity-provider-metadata-path: https://idp.dominio.es/SAML/metadata.xml
#cas.authn.pac4j.saml[0].metadata.identity-provider-metadata-path: file:${environment.metamac.data}/sso/saml/sp/idp-metadata.xml  

# As provider entity Id we use a URL, not necessarily resolvable, formed in a specific way according to what is defined in https://spaces.at.internet2.edu/display/federation/saml-metadata-entityid
# If we were on the IDP side, configuring a service in services/custom/*.json, its serviceId must be equal to this
#cas.authn.pac4j.saml[0].service-provider-entity-id: https://edatos.io/sp

# The folder file:${environment.metamac.data}/sso/saml/sp must exist, because CAS is not able to create intermediate folders
# However, the files service-provider-metadata-path and keystore-path do not need to exist, they are created when accessing /sp/metadata.
# The exception to this is if we need to use a specific valid certificate. In that case we must create the keystore ourselves
# To do this, starting from a pair of public key saml-signing-cert.crt and unencrypted private key saml-signing-cert.unencrypted.key:
# $ openssl rsa -aes256 -in saml-signing-cert.unencrypted.key -out saml-signing-cert.key
# Enter PEM pass phrase: example-password
# $ openssl pkcs12 -export -in saml-signing-cert.crt -inkey saml-signing-cert.key -out saml-signing-cert.p12
# $ keytool -importkeystore -srckeystore saml-signing-cert.p12 -srcstoretype PKCS12 -destkeystore sp-keystore.jks -deststoretype JKS
# Enter destination keystore password: example-password
# Re-enter new password: example-password
# Enter source keystore password: example-password
# Entry for alias 1 successfully imported.
# This sp-metadata.xml is specific for the service-provider-entity-id, and must be delivered to them so they can configure us as a valid SP / service
#cas.authn.pac4j.saml[0].service-provider-metadata-path: file:${environment.metamac.data}/sso/saml/sp/sp-metadata.xml
#cas.authn.pac4j.saml[0].keystore-path: file:${environment.metamac.data}/sso/saml/sp/sp-keystore.jks
#cas.authn.pac4j.saml[0].keystore-password: example-password
#cas.authn.pac4j.saml[0].private-key-password: example-password 
# Establish a CAS authenticated user (i.e. Principal) with an identifier that is mapped to the uid attribute returned from the provider https://fawnoos.com/2020/04/26/cas61x-delegate-authn-oauth/
# cas.authn.pac4j.core.principal-id-attribute: uid

# We haven't found any other way to resolve properly the principal id. Things like cas.authn.pac4j.saml[0].principal-attribute-id, that looks like could work, don't work on Apereo CAS 5.x
# This is later used on org.apereo.cas.authentication.principal.resolvers.PersonDirectoryPrincipalResolver.extractPrincipalId(Credential, Optional<Principal>)
# This looks like it could be problematic because is a general configuration that could go wrong with other providers, but: this looks like it works properly with DELEGATED_CAS and 
# if we enable this is because we are using it for SAML. For example with https://idp.caib.es/, if we don't enable this, we won't match permissions because it will use a different long alphanumeric string
# - https://github.com/apereo/cas/blob/5.3.x/docs/cas-server-documentation/installation/Configuration-Properties-Common.md#person-directory-principal-resolution
#cas.personDirectory.useExistingPrincipalId: true

